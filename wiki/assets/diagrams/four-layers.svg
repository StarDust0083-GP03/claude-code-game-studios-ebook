<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 286" width="420" height="286" role="img" aria-label="四种约束：从建议到强制">
<title>四种约束：从建议到强制</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
<text x="8" y="10" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="600" fill="var(--muted)" text-anchor="start" opacity="1">强制力递增</text><rect x="8" y="20" width="214" height="54" rx="2.5" fill="var(--paper-2)" stroke="var(--line)" stroke-width="0.8"/><text x="17" y="37" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="11" font-weight="600" fill="var(--ink)" text-anchor="start" opacity="1">常驻上下文</text><text x="17" y="52" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">CLAUDE.md 与 @ 导入的规则</text><text x="232" y="44" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">模型看得见，可以忽略</text><rect x="350" y="39" width="58" height="16" rx="8" fill="none" stroke="var(--muted)" stroke-width="0.9"/><text x="379.0" y="50.5" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="600" fill="var(--muted)" text-anchor="middle" opacity="1">建议</text><rect x="8" y="84" width="214" height="54" rx="2.5" fill="var(--paper-2)" stroke="var(--line)" stroke-width="0.8"/><text x="17" y="101" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="11" font-weight="600" fill="var(--ink)" text-anchor="start" opacity="1">按需加载</text><text x="17" y="116" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">SKILL.md、参考文档、Agent 提示词</text><text x="232" y="108" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">范围更窄，仍是文字</text><rect x="350" y="103" width="58" height="16" rx="8" fill="none" stroke="var(--muted)" stroke-width="0.9"/><text x="379.0" y="114.5" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="600" fill="var(--muted)" text-anchor="middle" opacity="1">较软</text><rect x="8" y="148" width="214" height="54" rx="2.5" fill="var(--paper-2)" stroke="var(--line)" stroke-width="0.8"/><text x="17" y="165" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="11" font-weight="600" fill="var(--ink)" text-anchor="start" opacity="1">Hook 回调</text><text x="17" y="180" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">settings.json 注册 15 条命令</text><text x="232" y="172" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">部分事件 exit 2 才阻断</text><rect x="350" y="167" width="58" height="16" rx="8" fill="none" stroke="var(--muted)" stroke-width="0.9"/><text x="379.0" y="178.5" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="600" fill="var(--muted)" text-anchor="middle" opacity="1">部分</text><rect x="8" y="212" width="214" height="54" rx="2.5" fill="var(--paper-2)" stroke="var(--amber)" stroke-width="1.4"/><text x="17" y="229" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="11" font-weight="600" fill="var(--ink)" text-anchor="start" opacity="1">宿主权限</text><text x="17" y="244" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">permissions.deny 命令模式</text><text x="232" y="236" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">宿主执行，不靠模型配合</text><rect x="350" y="231" width="58" height="16" rx="8" fill="none" stroke="var(--forest)" stroke-width="0.9"/><text x="379.0" y="242.5" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="600" fill="var(--forest)" text-anchor="middle" opacity="1">强制</text>
</svg>