<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 250" width="420" height="250" role="img" aria-label="四态判决的优先级">
<title>四态判决的优先级</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
<text x="8" y="10" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.4" font-weight="600" fill="var(--ink)" text-anchor="start" opacity="1">排序：失败 &gt; 无法评估 &gt; 带备注通过 &gt; 通过</text><rect x="8" y="22" width="404" height="40" rx="2.5" fill="var(--paper-2)" stroke="var(--amber)" stroke-width="1.3"/><text x="18" y="38" font-family="'IBM Plex Mono','SFMono-Regular',Consolas,monospace" font-size="9" font-weight="700" fill="var(--amber)" text-anchor="start" opacity="1">FAIL</text><text x="18" y="52" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">某条验收失败，或存在阻断级缺口</text><text x="402" y="46" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.2" font-weight="600" fill="var(--amber)" text-anchor="end" opacity="1">BLOCKED</text><rect x="8" y="72" width="404" height="40" rx="2.5" fill="var(--paper-2)" stroke="var(--forest)" stroke-width="1.3"/><text x="18" y="88" font-family="'IBM Plex Mono','SFMono-Regular',Consolas,monospace" font-size="9" font-weight="700" fill="var(--forest)" text-anchor="start" opacity="1">UNKNOWN</text><text x="18" y="102" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">无法评估：没说清、还没测、输入缺失</text><text x="402" y="96" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.2" font-weight="600" fill="var(--forest)" text-anchor="end" opacity="1">NOT ASSESSED</text><rect x="8" y="122" width="404" height="40" rx="2.5" fill="var(--paper-2)" stroke="var(--muted)" stroke-width="0.8"/><text x="18" y="138" font-family="'IBM Plex Mono','SFMono-Regular',Consolas,monospace" font-size="9" font-weight="700" fill="var(--muted)" text-anchor="start" opacity="1">PASS_WITH_NOTES</text><text x="18" y="152" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">全部通过或延期，但有建议级事项</text><text x="402" y="146" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.2" font-weight="600" fill="var(--muted)" text-anchor="end" opacity="1">COMPLETE WITH NOTES</text><rect x="8" y="172" width="404" height="40" rx="2.5" fill="var(--paper-2)" stroke="var(--forest)" stroke-width="0.8"/><text x="18" y="188" font-family="'IBM Plex Mono','SFMono-Regular',Consolas,monospace" font-size="9" font-weight="700" fill="var(--forest)" text-anchor="start" opacity="1">PASS</text><text x="18" y="202" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">全部通过，没有建议级事项</text><text x="402" y="196" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.2" font-weight="600" fill="var(--forest)" text-anchor="end" opacity="1">COMPLETE</text><text x="8" y="238" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">无法评估高于通过，低于失败；信息行不会把 COMPLETE 降级。</text>
</svg>