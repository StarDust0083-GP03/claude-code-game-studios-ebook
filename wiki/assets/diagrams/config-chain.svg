<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 350" width="420" height="350" role="img" aria-label="配置解析链">
<title>配置解析链</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
<text x="8" y="10" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="600" fill="var(--muted)" text-anchor="start" opacity="1">第一个合法值胜出；非法枚举继续下落</text><rect x="8" y="22" width="404" height="44" rx="2.5" fill="var(--paper-2)" stroke="var(--amber)" stroke-width="1.4"/><text x="17" y="39" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="var(--ink)" text-anchor="start" opacity="1">project.local.yaml</text><text x="17" y="54" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">仅白名单：review_mode / team.size</text><line x1="210" y1="66" x2="210" y2="78" stroke="var(--line)" stroke-width="1.1" marker-end="url(#arrow)"/><rect x="8" y="78" width="404" height="44" rx="2.5" fill="var(--paper-2)" stroke="var(--line)" stroke-width="0.8"/><text x="17" y="95" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="var(--ink)" text-anchor="start" opacity="1">project.yaml</text><text x="17" y="110" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">显式值优先于落盘镜像</text><line x1="210" y1="122" x2="210" y2="134" stroke="var(--line)" stroke-width="1.1" marker-end="url(#arrow)"/><rect x="8" y="134" width="404" height="44" rx="2.5" fill="var(--paper-2)" stroke="var(--line)" stroke-width="0.8"/><text x="17" y="151" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="var(--ink)" text-anchor="start" opacity="1">legacy 镜像</text><text x="17" y="166" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">review-mode.txt / production/stage.txt</text><line x1="210" y1="178" x2="210" y2="190" stroke="var(--line)" stroke-width="1.1" marker-end="url(#arrow)"/><rect x="8" y="190" width="404" height="44" rx="2.5" fill="var(--paper-2)" stroke="var(--line)" stroke-width="0.8"/><text x="17" y="207" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="var(--ink)" text-anchor="start" opacity="1">rigor 展开</text><text x="17" y="222" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">六个子设置；显式值继续压过展开</text><line x1="210" y1="234" x2="210" y2="246" stroke="var(--line)" stroke-width="1.1" marker-end="url(#arrow)"/><rect x="8" y="246" width="404" height="44" rx="2.5" fill="var(--paper-2)" stroke="var(--line)" stroke-width="0.8"/><text x="17" y="263" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="var(--ink)" text-anchor="start" opacity="1">末端默认</text><text x="17" y="278" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">minimal / collaborative</text><text x="8" y="322" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">输出值和来源：project.yaml / rigor:standard / default</text><text x="8" y="338" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--amber)" text-anchor="start" opacity="1">读白名单必须等于 /settings --local 的写白名单</text>
</svg>