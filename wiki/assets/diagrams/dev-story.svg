nt-weight="600" fill="var(--forest)" text-anchor="middle" opacity="1">3</text><rect x="38" y="110" width="374" height="38" rx="2.5" fill="var(--paper-2)" stroke="var(--line)" stroke-width="0.8"/><text x="47" y="127" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="var(--ink)" text-anchor="start" opacity="1">标记进行中</text><text x="47" y="142" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">只问一次；拒绝则不改状态继续</text><line x1="18" y1="142" x2="18" y2="160" stroke="var(--line)" stroke-width="1.1" marker-end="url(#arrow)"/><circle cx="18" cy="180" r="12" fill="var(--paper-2)" stroke="var(--forest)" stroke-width="0.9"/><text x="18" y="183.5" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="600" fill="var(--forest)" text-anchor="middle" opacity="1">4</text><rect x="38" y="160" width="374" height="38" rx="2.5" fill="var(--paper-2)" stroke="var(--line)" stroke-width="0.8"/><text x="47" y="177" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="var(--ink)" text-anchor="start" opacity="1">选择执行者</text><text x="47" y="192" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">按 Layer 与 Type 选程序员，再选引擎专家</text><line x1="18" y1="192" x2="18" y2="210" stroke="var(--line)" stroke-width="1.1" marker-end="url(#arrow)"/><circle cx="18" cy="230" r="12" fill="var(--paper-2)" stroke="var(--forest)" stroke-width="0.9"/><text x="18" y="233.5" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="600" fill="var(--forest)" text-anchor="middle" opacity="1">5</text><rect x="38" y="210" width="374" height="38" rx="2.5" fill="var(--paper-2)" stroke="var(--line)" stroke-width="0.8"/><text x="47" y="227" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="var(--ink)" text-anchor="start" opacity="1">简报派活</text><text x="47" y="242" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">给路径和要点，不粘贴整份文档</text><line x1="18" y1="242" x2="18" y2="260" stroke="var(--line)" stroke-width="1.1" marker-end="url(#arrow)"/><circle cx="18" cy="280" r="12" fill="var(--paper-2)" stroke="var(--forest)" stroke-width="0.9"/><text x="18" y="283.5" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="600" fill="var(--forest)" text-anchor="middle" opacity="1">6</text><rect x="38" y="260" width="374" height="38" rx="2.5" fill="var(--paper-2)" stroke="var(--amber)" stroke-width="1.4"/><text x="47" y="277" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="var(--ink)" text-anchor="start" opacity="1">产物与运行</text><text x="47" y="292" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">文件存在 → 测试存在 → 解析 → 截图观察</text><line x1="18" y1="292" x2="18" y2="310" stroke="var(--line)" stroke-width="1.1" marker-end="url(#arrow)"/><circle cx="18" cy="330" r="12" fill="var(--paper-2)" stroke="var(--forest)" stroke-width="0.9"/><text x="18" y="333.5" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="600" fill="var(--forest)" text-anchor="middle" opacity="1">7</text><rect x="38" y="310" width="374" height="38" rx="2.5" fill="var(--paper-2)" stroke="var(--line)" stroke-width="0.8"/><text x="47" y="327" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="var(--ink)" text-anchor="start" opacity="1">总结与检查点</text><text x="47" y="342" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">实际文件写入 ## Files，收尾三行</text><text x="8" y="370" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--amber)" text-anchor="start" opacity="1">琥珀框 = 门禁或检查点。P2 不通过：写 BLOCKED 检查点，不派代理。</text><text x="8" y="386" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.6" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">P6：报告不算完成，磁盘上的文件才算。</text>
</svg>